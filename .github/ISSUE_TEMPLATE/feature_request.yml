name: 기능 요청
description: 새로운 기능이나 개선을 제안합니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: story
    attributes:
      label: 사용자 스토리
      description: '"사용자로서 ~를 하고 싶다. 왜냐하면 ~이기 때문이다." 형식으로 적어주세요.'
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려했던 다른 방법이 있나요?
    validations:
      required: false
  - type: checkboxes
    id: yagni
    attributes:
      label: YAGNI 체크리스트
      description: 이 기능이 지금 정말 필요한가요?
      options:
        - label: 현재 워크플로우에서 실제로 부딪힌 문제입니다.
          required: true
        - label: 두 번째 이상의 사용 사례가 있습니다.
          required: false
        - label: 기존 기능으로 해결할 수 없음을 확인했습니다.
          required: true
  - type: textarea
    id: context
    attributes:
      label: 추가 컨텍스트
      description: 참고할 링크, 스크린샷, 관련 이슈 등이 있으면 적어주세요.
    validations:
      required: false
